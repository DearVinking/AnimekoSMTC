name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MACOSX_DEPLOYMENT_TARGET: '11.0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-26, macos-26-intel]
        toolchain: [stable, '1.85.0']
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            java_arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            java_arch: x64
          - os: macos-26
            target: aarch64-apple-darwin
            java_arch: aarch64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            java_arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java_arch }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Locate Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-windows.ps1
      - name: Resolve dependencies
        run: cargo fetch --locked
      - name: Record dependency compiler requirements
        shell: bash
        run: cargo metadata --locked --format-version 1 > dependency-metadata.json
      - name: Prepare formatting diff
        if: matrix.toolchain == 'stable'
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary --output=ci-format.patch
      - name: Build native executable and JVM probe
        run: cargo build --workspace --locked
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Exercise real JVMTI callbacks and JNI sampling
        run: python tests/probe_integration.py
      - name: Require committed formatting
        run: git diff --exit-code
      - name: Upload dependency lock and formatting patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-support-${{ matrix.target }}-${{ matrix.toolchain }}
          path: |
            Cargo.lock
            ci-format.patch
            dependency-metadata.json
      - name: Upload Windows verification binaries
        if: runner.os == 'Windows' && matrix.toolchain == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-verification
          path: |
            target/debug/AnimekoSMTC.exe
            target/debug/animeko_probe.dll
          if-no-files-found: error
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock
