name: Package Windows
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Locate Windows build tools
        shell: pwsh
        run: ./.github/scripts/setup-windows.ps1
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --release --locked
      - run: python tests/probe_integration.py --release
      - name: Create portable package
        id: package
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'animeko-smtc').version
          if (-not $version) { throw 'Missing package version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path dist/AnimekoSMTC -Force | Out-Null
          Copy-Item target/release/AnimekoSMTC.exe,target/release/animeko_probe.dll,README.md,LICENSE,THIRD-PARTY-NOTICES.txt -Destination dist/AnimekoSMTC
          Copy-Item licenses -Destination dist/AnimekoSMTC -Recurse
          $archive = "AnimekoSMTC-$version-windows-x64.zip"
          Compress-Archive -Path dist/AnimekoSMTC -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content dist/SHA256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AnimekoSMTC-${{ steps.package.outputs.version }}-windows-x64
          path: |
            dist/AnimekoSMTC-*-windows-x64.zip
            dist/SHA256.txt
          retention-days: 30
