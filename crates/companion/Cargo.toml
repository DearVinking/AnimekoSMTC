[package]
name = "animeko-smtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "AnimekoSMTC"
path = "src/main.rs"

[dependencies]
animeko-protocol.workspace = true
anyhow.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation", "Media", "Storage_Streams",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com",
    "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSArray", "NSBundle", "NSDictionary", "NSObject", "NSString", "NSValue",
    "NSFileManager", "NSPathUtilities", "NSURL", "NSTimer", "NSRunLoop", "NSDate", "NSGeometry",
    "NSURLSession", "NSURLRequest", "NSURLResponse", "NSURLCache", "NSURLCredentialStorage",
    "NSHTTPCookieStorage", "NSOperation", "NSData", "NSError", "block2",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "NSAlert", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder",
    "NSRunningApplication", "NSSavePanel", "NSView", "NSWindow", "NSEvent", "NSGraphicsContext", "NSImage", "objc2-core-graphics",
] }
libc = "0.2"
objc2-media-player = { version = "0.3.2", default-features = false, features = [
    "std", "MPMediaEntity", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand",
    "MPRemoteCommandCenter", "MPRemoteCommandEvent", "block2", "objc2-app-kit", "objc2-core-foundation",
] }
block2 = "0.6"

objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }

[[test]]
name = "macos_session"
path = "tests/macos_session.rs"
harness = false
